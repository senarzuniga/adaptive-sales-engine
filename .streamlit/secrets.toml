# Streamlit Cloud secrets template
# IMPORTANT: Do not commit real credentials.

SUPABASE_URL = "https://your-project-ref.supabase.co"
SUPABASE_KEY = "your-anon-or-publishable-key"
SUPABASE_SERVICE_ROLE_KEY = "your-service-role-key"

# Gmail SMTP sender for automated user invitations
GMAIL_ADDRESS = "isenar.cta@gmail.com"
GMAIL_APP_PASSWORD = "your-google-app-password"

# Public URL of the deployed Streamlit app
STREAMLIT_APP_URL = "https://your-app-name.streamlit.app"

# Feature flags — accepted values: true / false / "true" / "1" / "yes"
# QUICK_ACCESS_ENABLED defaults to true — no need to set this unless you want
# to disable guest access.  Leave commented out for the safe default.
# QUICK_ACCESS_ENABLED = false

# Set FULL_ACCESS_ALL_USERS = true to give every authenticated user admin-level
# navigation access regardless of their profile role.
FULL_ACCESS_ALL_USERS = false
